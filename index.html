<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barbería Elite - InteliSite Demo</title>
    <!-- FAVICON: Poste de Barbero 💈 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💈</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #020617; /* slate-950 */
      }
      ::-webkit-scrollbar-thumb {
        background: #475569;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d97706; /* amber-600 */
      }
      
      /* Smooth Scroll */
      html {
        scroll-behavior: smooth;
      }

      /* Hide scrollbar for clean UI in specific containers */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* --- NEW ANIMATION: ROCK SWAY (Balanceo del Logo) --- */
      @keyframes rock-sway {
        0%, 100% { 
          transform: rotate(-6deg) translateY(0); 
        }
        50% { 
          transform: rotate(6deg) translateY(-4px); 
        }
      }
      
      .animate-rock-sway {
        animation: rock-sway 4s ease-in-out infinite;
      }

      /* --- CHAT BUBBLE SPRING ANIMATION --- */
      @keyframes bubble-in {
        0% {
          opacity: 0;
          transform: translateX(30px) translateY(10px) scale(0.95);
        }
        70% {
          transform: translateX(-2px) translateY(-1px) scale(1.02);
        }
        100% {
          opacity: 1;
          transform: translateX(0) translateY(0) scale(1);
        }
      }
      
      .animate-bubble-in {
        animation: bubble-in 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      /* --- SLIDE UP & FADE IN TRANSITIONS FOR DRAWER/SHEETS --- */
      @keyframes slide-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
      .animate-slide-up {
        animation: slide-up 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes slide-left {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-left {
        animation: slide-left 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fade-in 0.25s ease-out forwards;
      }

      /* --- BORDER LIGHT SWEEP LOOP ANIMATION --- */
      @keyframes border-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .animate-border-spin {
        animation: border-spin 3s linear infinite;
      }

      /* --- 3D CARD FLIP STYLES --- */
      .perspective-1000 {
        perspective: 1000px;
      }
      .transform-style-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .rotate-y-180 {
        transform: rotateY(180deg);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-950 text-slate-100 overflow-x-hidden selection:bg-amber-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
